[theme]
primaryColor = "#818cf8"
backgroundColor = "#06080f"
secondaryBackgroundColor = "#0c1019"
textColor = "#f1f5f9"
font = "sans serif"

[server]
port = 8501
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
fileWatcherType = "poll"

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
