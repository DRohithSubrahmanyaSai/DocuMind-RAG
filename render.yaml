# ==============================================================================
# DocuMind-RAG Render Blueprint (Free Tier Deployment)
# Author: D Rohith Subrahmanya Sai
# GitHub: https://github.com/DRohithSubrahmanyaSai/DocuMind-RAG
# ==============================================================================

services:
  - type: web
    name: documind-rag-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: CHUNK_SIZE
        value: 600
      - key: CHUNK_OVERLAP
        value: 80
      - key: DEFAULT_TOP_K
        value: 4
      - key: RRF_K
        value: 60
